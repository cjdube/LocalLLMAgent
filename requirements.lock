# Generated lock file — the full dependency closure, exact versions.
# DO NOT hand-edit. Declare intent in requirements.txt; regenerate this from it.
#
# Install from this file. requirements.txt pins only the packages we import
# directly, which left everything underneath them free to float: rebuilding the
# venv on 2026-08-14 silently moved google-api-core 2.31.0 -> 2.34.0, google-auth
# 2.55.1 -> 2.56.3 and cryptography 49 -> 50. Nothing failed, but nothing would
# have caught it either — the test suite monkeypatches every Google collaborator,
# so a breaking change in the client libs reaches production before it reaches a
# test. That is the exact risk requirements.txt's own header claims to prevent,
# and it could not, because it doesn't reach this far.
#
# Runtime only. Dev tooling stays unpinned in requirements-dev.txt: pytest
# breaking costs an afternoon, not a scheduled job.
#
# To bump a dependency:
#   1. edit the pin in requirements.txt
#   2. python3.12 -m venv /tmp/lockenv && /tmp/lockenv/bin/pip install -r requirements.txt
#   3. /tmp/lockenv/bin/pip freeze > requirements.lock   (keep this header)
#   4. .venv/bin/pip install -r requirements.lock -r requirements-dev.txt
#   5. run pytest AND a real Google/Ollama smoke call — the suite cannot see
#      transitive breakage (see docs/model-constraints.md for the same lesson
#      about what monkeypatched tests hide)
