<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wren Settings</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="alternate icon" type="image/png" href="/static/favicon-32.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="stylesheet" href="/static/nav.css">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    color: #1f2328;
    background: #f4f4f5;
  }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; background: #ffffff; border-bottom: 1px solid #e5e7eb;
  }
  header img.logo { height: 38px; width: 38px; border-radius: 9px; display: block; }
  header h1 { font-size: 17px; margin: 0; }
  header .sub { font-size: 13px; color: #9ca3af; }
  header .spacer { flex: 1; }

  main { max-width: 860px; margin: 0 auto; padding: 18px 18px 120px; }

  .page-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .page-head img.mark { height: 26px; width: 26px; border-radius: 7px; display: block; }
  .page-head h2 { font-size: 20px; margin: 0; font-weight: 600; }
  .page-head .spacer { flex: 1; }

  .card {
    background: #fff; border: 1px solid #e5e7eb; border-radius: 12px;
    padding: 14px 16px; margin-bottom: 14px;
  }
  /* The rule under the heading repeats the open tab's colour, so the panel and
     the rail read as one place. --accent is set per card by settings-form.js;
     the grey is what a card gets if it ever renders without one. */
  .card h2 {
    font-size: 14px; margin: 0 0 10px; font-weight: 600;
    padding-bottom: 7px; border-bottom: 2px solid var(--accent, #e5e7eb);
  }

  /* One group on screen at a time, picked from the rail. Every card is still
     in the document — hidden, not absent — so a save collects the fields on
     the tabs you are not looking at, and so does clearErrors. */
  .settings-tabs {
    display: grid; grid-template-columns: 190px minmax(0, 1fr);
    gap: 18px; align-items: start;
  }
  .rail { display: flex; flex-direction: column; gap: 1px; position: sticky; top: 14px; }
  .rail button {
    font: inherit; font-size: 13px; text-align: left; cursor: pointer;
    padding: 7px 10px; border: 0; border-left: 3px solid transparent;
    border-radius: 0 8px 8px 0; background: transparent; color: #6b7280;
    display: flex; align-items: center; gap: 8px; scroll-margin-inline: 18px;
  }
  .rail button:hover { background: rgba(0, 0, 0, 0.04); }
  /* Two declarations, not one: color-mix is absent on older WebKit, which then
     keeps the flat white and still reads as the open tab. */
  .rail button[aria-current="true"] {
    background: #fff; color: #1f2328; font-weight: 600;
    border-left-color: var(--accent, #1f2328);
  }
  .rail button[aria-current="true"] {
    background: color-mix(in srgb, var(--accent, #1f2328) 12%, #fff);
  }
  /* The dot is the only place the accent touches the rail when a tab is shut,
     which is what makes thirteen labels scannable. */
  .rail .dot {
    width: 8px; height: 8px; border-radius: 50%; flex: none;
    background: var(--accent, #d5d8dd);
  }
  .rail .rail-label { min-width: 0; }
  .rail .flag { margin-left: auto; color: #b42318; font-weight: 700; }
  .panels > .card { display: none; }
  .panels > .card.active { display: block; }

  /* Phone: the rail becomes one side-scrolling row of chips. Thirteen chips
     wrapped into four rows would eat the screen the tabs exist to give back. */
  @media (max-width: 720px) {
    .settings-tabs { grid-template-columns: 1fr; gap: 12px; }
    .rail {
      flex-direction: row; gap: 6px; top: 0; z-index: 2;
      overflow-x: auto; -webkit-overflow-scrolling: touch;
      margin: 0 -18px; padding: 8px 18px;
      background: #f4f4f5; scrollbar-width: none;
    }
    .rail::-webkit-scrollbar { display: none; }
    .rail button {
      flex: 0 0 auto; border-left: 0; border-radius: 999px;
      border: 1px solid #e5e7eb; background: #fff; padding: 6px 12px;
      white-space: nowrap;
    }
    .rail button[aria-current="true"] { border-color: var(--accent, #1f2328); }
  }

  /* One field per row on a phone, label above input. This page is edited from
     the phone as often as the laptop, and a two-column form there puts a 40px
     input beside a 200px label. */
  .field { padding: 12px 0; border-bottom: 1px solid #f1f2f4; }
  .field:last-child { border-bottom: none; }
  .field-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .field-label { font-size: 13px; font-weight: 600; }
  .field-key { font-size: 11px; color: #9ca3af; font-family: ui-monospace, Menlo, monospace; }
  .field-help { font-size: 12px; color: #6b7280; line-height: 1.5; margin: 4px 0 8px; }
  .field input, .field select {
    font: inherit; font-size: 14px; width: 100%; padding: 7px 9px;
    border: 1px solid #d5d8dd; border-radius: 8px; background: #fff; color: #1f2328;
  }
  .field input:disabled, .field select:disabled { background: #f6f7f8; color: #9ca3af; }
  .field-error { font-size: 12px; color: #b42318; margin-top: 6px; }
  .field.bad input, .field.bad select { border-color: #b42318; }

  .tag {
    font-size: 11px; padding: 1px 7px; border-radius: 999px;
    border: 1px solid #e5e7eb; color: #6b7280; background: #fafafa;
  }
  .tag.restart { color: #92400e; border-color: #fde68a; background: #fffbeb; }
  .tag.next-run { color: #3730a3; border-color: #e0e7ff; background: #eef2ff; }
  .tag.locked { color: #6b7280; }
  .tag.env { color: #92400e; border-color: #fde68a; background: #fffbeb; }
  .tag.set { color: #166534; border-color: #dcfce7; background: #f0fdf4; }

  .lock-note { font-size: 12px; color: #9ca3af; line-height: 1.5; margin: 4px 0 0; }

  .banner {
    border-radius: 12px; padding: 12px 14px; margin-bottom: 14px;
    font-size: 13px; line-height: 1.55;
  }
  .banner.warn { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; }
  .banner.good { background: #f0fdf4; border: 1px solid #dcfce7; color: #166534; }
  .banner.bad  { background: #fef2f2; border: 1px solid #fecaca; color: #b42318; }
  .banner p { margin: 0 0 6px; }
  .banner p:last-child { margin-bottom: 0; }
  .banner code {
    display: block; margin-top: 6px; padding: 7px 9px; border-radius: 8px;
    background: rgba(0, 0, 0, 0.05); font-family: ui-monospace, Menlo, monospace;
    font-size: 12px; overflow-x: auto; white-space: pre;
  }
  .banner button {
    font: inherit; font-size: 12px; margin-top: 8px; padding: 4px 10px; cursor: pointer;
    border: 1px solid currentColor; border-radius: 8px; background: transparent; color: inherit;
  }

  /* A section is JSON because there is no general editor for a list of calendar
     categories, and a wrong-shaped one is refused by the same validator the
     tests assert through — so a bad paste is a message, not a broken brief. */
  .field textarea {
    font-family: ui-monospace, Menlo, monospace; font-size: 12px; line-height: 1.5;
    width: 100%; min-height: 150px; padding: 8px 9px;
    border: 1px solid #d5d8dd; border-radius: 8px; background: #fff; color: #1f2328;
  }
  .field.bad textarea { border-color: #b42318; }

  .savebar {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: flex; align-items: center; gap: 12px;
    padding: 11px 18px; background: #ffffff; border-top: 1px solid #e5e7eb;
  }
  .savebar .spacer { flex: 1; }
  .savebar .status { font-size: 13px; color: #6b7280; }
  .savebar button {
    font: inherit; font-size: 14px; padding: 7px 18px; cursor: pointer;
    border: 1px solid #1f2328; border-radius: 8px; background: #1f2328; color: #fff;
  }
  .savebar button:disabled { opacity: 0.45; cursor: default; }

  .empty { font-size: 13px; color: #9ca3af; margin: 4px 0; }
</style>
</head>
<body>
  <header>
    <img class="logo" src="/static/favicon.svg" alt="Wren">
    <h1>Wren</h1>
    <span class="sub">settings</span>
    <span class="spacer"></span>
    <nav id="wren-nav" class="wren-nav"></nav>
  </header>

  <main>
    <div class="page-head">
      <img class="mark" src="/static/favicon.svg" alt="">
      <h2>Settings</h2>
      <span class="spacer"></span>
    </div>

    <div id="settingsBanners"></div>
    <div class="settings-tabs">
      <nav class="rail" id="settingsRail" aria-label="Settings sections"></nav>
      <div class="panels" id="settingsGroups"><p class="empty">Loading…</p></div>
    </div>
  </main>

  <div class="savebar">
    <span class="status" id="settingsStatus"></span>
    <span class="spacer"></span>
    <button type="button" id="settingsSave" disabled>Save</button>
  </div>

  <script src="/static/nav.js"></script>
  <script src="/static/settings-form.js"></script>
</body>
</html>
