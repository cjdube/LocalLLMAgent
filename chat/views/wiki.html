<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wren Wiki</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="alternate icon" type="image/png" href="/static/favicon-32.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="stylesheet" href="/static/nav.css">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    color: #c8cdd8;
    background: #05060e;
    display: flex;
    flex-direction: column;
    height: 100vh;
    --nav-fg: #7c86a3;
    --nav-fg-active: #e8eaf2;
  }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; background: rgba(10, 12, 24, 0.85);
    border-bottom: 1px solid #171b2e;
  }
  header img.logo { height: 38px; width: 38px; border-radius: 9px; display: block; }
  header h1 { font-size: 17px; margin: 0; color: #e8eaf2; }
  header .sub { font-size: 13px; color: #565d75; }
  header .spacer { flex: 1; }

  .controls {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 9px 16px; background: #080a16; border-bottom: 1px solid #171b2e;
    font-size: 12.5px; color: #7c86a3;
  }
  .controls input[type="search"] {
    padding: 6px 10px; font-size: 13px; min-width: 170px;
    background: #0d1020; color: #e8eaf2;
    border: 1px solid #232842; border-radius: 8px;
  }
  .controls label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; white-space: nowrap; }
  .controls .swatch { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .sw-concept { background: #22d3ee; }
  .sw-log { background: #4b5675; }
  .sw-lens { background: #d98d4a; }
  .sw-project { background: #6f8fd9; }
  .controls button {
    padding: 6px 11px; font-size: 12.5px; cursor: pointer;
    background: #0d1020; color: #aab1c7; border: 1px solid #232842; border-radius: 8px;
  }
  .controls button:hover { background: #131730; }
  .controls .spacer { flex: 1; }
  #graphStatus { color: #565d75; }
  #dangling {
    color: #e3b341; text-decoration: none; border-bottom: 1px dotted #6b551d;
  }

  main { flex: 1; display: flex; min-height: 0; }
  #stage { flex: 1; min-width: 0; position: relative;
           background: radial-gradient(circle at 50% 46%, #10142a 0%, #0a0d1d 45%, #05060e 78%); }
  #graph { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }

  aside {
    width: 320px; flex: none; overflow-y: auto; padding: 16px;
    background: #080a16; border-left: 1px solid #171b2e;
  }
  aside h2 { font-size: 15px; margin: 0 0 8px; color: #e8eaf2; }
  aside p { margin: 0 0 10px; font-size: 13px; line-height: 1.55; }
  aside .hint { color: #565d75; }
  aside .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 10px; }
  aside .kind { font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px;
                background: #131730; color: #aab1c7; }
  aside .kind-concept { color: #22d3ee; }
  aside .kind-lens { color: #d98d4a; }
  aside .kind-project { color: #6f8fd9; }
  aside .kind-log { color: #8b93ab; }
  aside .slug, aside .updated { font-size: 11.5px; color: #565d75; font-family: ui-monospace, Menlo, monospace; }
  aside .summary { color: #aab1c7; }
  aside .links-label { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #565d75; margin-bottom: 6px; }
  aside .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 14px; }
  aside .chip {
    font: inherit; font-size: 11.5px; cursor: pointer; padding: 3px 8px;
    background: #0d1020; color: #22d3ee; border: 1px solid #1b2038; border-radius: 7px;
    font-family: ui-monospace, Menlo, monospace;
  }
  aside .chip:hover { background: #131730; }
  /* A link to a page a filter is hiding. Still listed — the page really does
     link there — but marked, and clicking it turns that filter back on. */
  aside .chip.is-hidden { color: #565d75; border-style: dashed; }
  aside .read {
    font: inherit; font-size: 12.5px; cursor: pointer; padding: 6px 11px;
    background: #0d1020; color: #aab1c7; border: 1px solid #232842; border-radius: 8px;
  }
  aside .page-body {
    margin: 10px 0 0; padding: 11px; max-height: 420px; overflow: auto;
    background: #05060e; border: 1px solid #171b2e; border-radius: 8px;
    font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; line-height: 1.55;
    white-space: pre-wrap; overflow-wrap: anywhere; color: #8b93ab;
  }

  /* Phone: the panel goes under the canvas rather than beside it. */
  @media (max-width: 760px) {
    main { flex-direction: column; }
    #stage { min-height: 52vh; }
    aside { width: auto; border-left: none; border-top: 1px solid #171b2e; max-height: 48vh; }
  }
</style>
</head>
<body>
  <header>
    <img class="logo" src="/static/favicon.svg" alt="Wren">
    <h1>Wren</h1>
    <span class="sub">wiki</span>
    <span class="spacer"></span>
    <nav id="wren-nav" class="wren-nav"></nav>
  </header>

  <div class="controls">
    <input id="search" type="search" placeholder="Find a page…" autocomplete="off">
    <label><input type="checkbox" id="kind-concept" checked><span class="swatch sw-concept"></span>concepts</label>
    <label><input type="checkbox" id="kind-log"><span class="swatch sw-log"></span>daily logs</label>
    <label><input type="checkbox" id="kind-lens" checked><span class="swatch sw-lens"></span>lenses</label>
    <label><input type="checkbox" id="kind-project" checked><span class="swatch sw-project"></span>projects</label>
    <label><input type="checkbox" id="orphansOnly">orphans only</label>
    <button id="relayout" type="button">Re-run layout</button>
    <span class="spacer"></span>
    <a id="dangling" href="/wiki/lint" hidden></a>
    <span id="graphStatus">Loading…</span>
  </div>

  <main>
    <div id="stage"><canvas id="graph"></canvas></div>
    <aside id="detail"></aside>
  </main>

<script src="/static/nav.js"></script>
<script src="/static/wiki-graph.js"></script>
</body>
</html>
