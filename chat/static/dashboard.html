<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wren Dashboard</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="alternate icon" type="image/png" href="/static/favicon-32.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="stylesheet" href="/static/nav.css">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    color: #1f2328;
    background: #f4f4f5;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    background: #ffffff;
    border-bottom: 1px solid #e5e7eb;
  }
  header img.logo { height: 38px; width: 38px; border-radius: 9px; display: block; }
  header h1 { font-size: 17px; margin: 0; }
  header .sub { font-size: 13px; color: #9ca3af; }
  header .spacer { flex: 1; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 20px;
    background: #ecfdf3; color: #067647;
  }
  .pill .glow { width: 7px; height: 7px; border-radius: 50%; background: #17b26a; }
  .pill.down { background: #fef3f2; color: #b42318; }
  .pill.down .glow { background: #f04438; }
  .pill.off { background: #f2f4f7; color: #667085; }
  .pill.off .glow { background: #98a2b3; }

  main { flex: 1; display: flex; min-height: 0; }
  .content { flex: 1; min-width: 0; overflow-y: auto; padding: 20px 18px; display: flex; flex-direction: column; gap: 22px; }
  .section-label { font-size: 13px; font-weight: 600; color: #6b7280; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: baseline; }
  .section-label .hint { font-weight: 400; font-size: 12px; color: #9ca3af; }

  .panel { background: #ffffff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 14px 16px; }

  .stats { display: flex; flex-wrap: wrap; gap: 28px; }
  .stat { min-width: 110px; }
  .stat .figure { font-size: 22px; font-weight: 600; color: #111827; line-height: 1.2; }
  .stat .figure.warn { color: #b54708; }
  .stat .label { font-size: 12px; color: #6b7280; margin-top: 2px; }
  /* pre-line: the pending list is one filename per line, joined with \n. */
  .stat .detail { font-size: 11px; color: #9ca3af; margin-top: 4px; line-height: 1.5; white-space: pre-line; }

  .cap-group-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; color: #9ca3af; margin-bottom: 8px; }
  .cap-group-label:not(:first-child) { margin-top: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 12px; padding: 4px 10px; border-radius: 20px; cursor: pointer;
    border: 1px solid transparent; user-select: none;
  }
  .chip.ro { background: #eff8ff; color: #175cd3; }
  .chip.wr { background: #fef0c7; color: #b54708; }
  .chip.active { border-color: currentColor; }
  .cap-detail { margin-top: 12px; border-top: 1px solid #f1f2f4; padding-top: 12px; display: none; }
  .cap-detail.show { display: block; }
  .cap-detail h4 { margin: 0 0 4px; font-size: 14px; }
  .cap-detail .desc { font-size: 13px; color: #4b5563; margin-bottom: 8px; }
  .param { font-size: 12px; color: #475467; margin: 3px 0; }
  .param .pname { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: #1f2328; }
  .req { color: #b42318; }

  table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; overflow: hidden; }
  thead th { text-align: left; background: #fafafa; color: #6b7280; font-weight: 600; font-size: 11px; padding: 9px 12px; border-bottom: 1px solid #eef0f2; }
  tbody td { padding: 12px; font-size: 13px; border-top: 1px solid #f1f2f4; vertical-align: middle; }
  tbody tr.task-row { cursor: pointer; }
  tbody tr.task-row:hover td { background: #fafafa; }
  tbody tr.daemon td { background: #fafafa; color: #6b7280; }
  td.name { font-weight: 600; }
  td.sched, td.next { color: #4b5563; }

  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px; white-space: nowrap; }
  .badge.success { background: #ecfdf3; color: #067647; }
  .badge.failure { background: #fef3f2; color: #b42318; }
  .badge.running { background: #eff8ff; color: #175cd3; }
  .badge.none    { background: #f2f4f7; color: #667085; }
  .dots { display: flex; gap: 3px; margin-top: 7px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #e5e7eb; }
  .dot.success { background: #17b26a; }
  .dot.failure { background: #f04438; }
  .dot.running { background: #2e90fa; }

  .actions { display: flex; flex-wrap: wrap; gap: 6px; }
  button.btn { font-size: 12px; padding: 6px 11px; border-radius: 8px; border: 1px solid #d0d5dd; background: #fff; color: #1f2328; cursor: pointer; }
  button.btn.primary { background: #1f2328; color: #fff; border-color: #1f2328; }
  button.btn:disabled { opacity: 0.5; cursor: default; }

  /* --- agent identity ---------------------------------------------------
     One colour per owner, matching /map: Wren blue, ScribeJay teal, a federated
     repo purple. Everything below — the chart line, the card tint, the header
     band — reads its colour from whichever of these the enclosing .house sets,
     so ownership is carried by the palette rather than restated in every row. */
  .ag-wren      { --ag: #3b6fd4; --ag-bg: #eff4ff; --ag-fg: #1d4ed8; }
  .ag-scribejay { --ag: #0d9488; --ag-bg: #effcfa; --ag-fg: #0f766e; }
  .ag-external  { --ag: #7c5cd6; --ag-bg: #f5f2ff; --ag-fg: #6d28d9; }
  .ag-daemon    { --ag: #98a2b3; --ag-bg: #f2f4f7; --ag-fg: #667085; }

  /* --- one box per agent ------------------------------------------------
     The header is the whole control: click it to fold the agent away. Folded,
     the header is all that is left, so it has to answer "is this one healthy"
     on its own — hence the counts, the failure tally and the slowest job all
     live in the header rather than in the body it hides. */
  .house { border: 1px solid #e5e7eb; border-radius: 12px; overflow: hidden; background: #fff; margin-bottom: 16px; }
  .house-head { display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; background: var(--ag-bg); border-bottom: 1px solid #e5e7eb; cursor: pointer; user-select: none; }
  .house-head:hover { filter: brightness(0.985); }
  .house-head .caret { font-size: 15px; line-height: 1; color: var(--ag-fg); width: 15px; flex-shrink: 0; padding-top: 10px; opacity: .8; }
  .house-head .mark { width: 34px; height: 34px; border-radius: 9px; background: var(--ag); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; flex-shrink: 0; }
  .house-head h3 { margin: 0; font-size: 15px; color: var(--ag-fg); }
  .house-head .role { font-size: 12px; color: #4b5563; margin-top: 2px; }
  .house-head .slow { font-size: 11px; color: #6b7280; margin-top: 3px; }
  .house-head .facts { margin-left: auto; text-align: right; font-size: 12px; color: #4b5563; white-space: nowrap; }
  .house-head .facts b { font-size: 18px; color: #111827; display: block; line-height: 1.15; }
  .house-body[hidden] { display: none; }
  .house-charts { padding: 14px 16px; border-bottom: 1px solid #e5e7eb; }
  .house table { border: none; border-radius: 0; }
  .house table thead th:first-child, .house table td.name { padding-left: 16px; }
  .foldall { font-weight: 500; font-size: 12px; color: #6b7280; background: none; border: none; cursor: pointer; padding: 0; text-decoration: underline; }

  /* Run-duration charts (rendered by run-chart.js) */
  /* Below desktop, as many 250px columns as fit — two on a tablet, one on a
     phone. At desktop width it's pinned to four. The row count is left to fall
     out of the task count rather than being pinned too, so an extra task wraps
     instead of squashing. One grid per agent, so the counts are per-agent. */
  .chart-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
  @media (min-width: 1100px) { .chart-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  /* Each chart is its own card. Sharing one panel, twelve sparklines ran
     together — a neighbour's line reads as a continuation of your own. Tinted
     to the owning agent, so a card says whose job it is before you read it. */
  .chart-cell { min-width: 0; background: var(--ag-bg, #fffbeb); border: 1px solid #e9ecf0; border-radius: 12px; padding: 12px 14px; }
  .chart-head { display: flex; align-items: baseline; gap: 8px; }
  /* One line, always: a name that wraps pushes its chart out of alignment with
     the rest of its row. Truncated names keep their full text in a tooltip. */
  .chart-name { font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chart-stat { margin-left: auto; font-size: 11px; color: #9ca3af; white-space: nowrap; }
  .chart-empty { font-size: 11px; color: #9ca3af; padding: 16px 0; }
  .chart-svg { width: 100%; height: auto; display: block; }
  .chart-median { stroke: #e5e7eb; stroke-width: 1; stroke-dasharray: 3 3; }
  .chart-line { fill: none; stroke: var(--ag, #2e90fa); stroke-width: 1.4; stroke-linejoin: round; }
  .pt { fill: var(--ag, #2e90fa); }
  .pt.fail { fill: #f04438; }

  /* Run-detail slide-over */
  .backdrop { position: fixed; inset: 0; background: rgba(16,24,40,0.4); opacity: 0; pointer-events: none; transition: opacity 0.18s ease; z-index: 40; }
  .backdrop.show { opacity: 1; pointer-events: auto; }
  .drawer { position: fixed; top: 0; right: 0; height: 100%; width: min(480px, 94vw); background: #fff; border-left: 1px solid #e5e7eb; transform: translateX(100%); transition: transform 0.2s ease; z-index: 41; display: flex; flex-direction: column; }
  .drawer.open { transform: translateX(0); }
  .drawer-head { padding: 14px 16px; border-bottom: 1px solid #e5e7eb; display: flex; align-items: center; gap: 10px; }
  .drawer-head h2 { margin: 0; font-size: 16px; flex: 1; }
  .drawer-head .close { background: none; border: none; font-size: 20px; color: #6b7280; cursor: pointer; line-height: 1; }
  .drawer-body { flex: 1; overflow-y: auto; padding: 16px; }
  .link-btn { background: none; border: none; color: #175cd3; cursor: pointer; font-size: 14px; padding: 0; margin-bottom: 12px; }
  .muted { color: #9ca3af; font-size: 13px; }
  .timeline { display: flex; flex-direction: column; gap: 8px; }
  .call { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 10px 12px; }
  .call .cname { font-weight: 600; font-size: 13px; }
  .call .cargs, .call .cresult { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: #475467; white-space: pre-wrap; word-break: break-word; margin-top: 4px; }
  .call .cresult { color: #1f2328; }
  .final { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 10px; padding: 12px; font-size: 14px; white-space: pre-wrap; }
  .error-box { background: #fef3f2; border: 1px solid #fecdca; border-radius: 10px; padding: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: #b42318; white-space: pre-wrap; word-break: break-word; margin-top: 10px; }
  .drawer-body table th, .drawer-body table td { font-size: 13px; }
</style>
</head>
<body>
  <header>
    <img class="logo" src="/static/favicon.svg" alt="Wren">
    <h1>Wren</h1>
    <span class="sub">dashboard</span>
    <span class="spacer"></span>
    <nav id="wren-nav" class="wren-nav"></nav>
    <span id="serverPill" class="pill"><span class="glow"></span>server running</span>
    <span id="pushPill" class="pill off"><span class="glow"></span>ntfy …</span>
  </header>

  <main>
    <div class="content">
      <section>
        <div class="section-label">
          <span>Scheduled tasks <span id="taskHint" class="hint"></span></span>
          <button id="foldAll" class="foldall" type="button">collapse all</button>
        </div>
        <div id="tasksWrap" class="muted">Loading…</div>
      </section>
      <section>
        <div class="section-label">Learnings wiki <span id="vaultHint" class="hint"></span></div>
        <div id="vaultPanel" class="panel muted">Loading…</div>
      </section>
      <section>
        <div class="section-label">Capabilities</div>
        <div id="capPanel" class="panel">Loading…</div>
      </section>
    </div>
  </main>

  <div id="backdrop" class="backdrop"></div>
  <div id="drawer" class="drawer">
    <div class="drawer-head">
      <h2 id="drawerTitle"></h2>
      <button id="drawerClose" class="close" aria-label="Close">&times;</button>
    </div>
    <div id="drawerBody" class="drawer-body"></div>
  </div>

<script src="/static/run-chart.js"></script>
<script>
// --- helpers ------------------------------------------------------------- //
async function api(path, opts) { return (await fetch(path, opts)).json(); }
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;  // textContent only — never innerHTML
  return e;
}
function fmtTs(ts) {
  if (!ts) return "—";
  const d = new Date(ts.replace(",", ".").replace(" ", "T"));
  if (isNaN(d)) return ts;
  return d.toLocaleString([], { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
}
function fmtDur(s) {
  if (s == null) return "—";
  if (s < 60) return Math.round(s) + "s";
  return `${Math.floor(s / 60)}m ${Math.round(s % 60)}s`;
}
function badge(status) {
  const labels = { success: "✓ ok", failure: "✗ failed", running: "• running", none: "no runs" };
  return el("span", "badge " + status, labels[status] || status);
}
function dotStrip(statuses) {
  const strip = el("div", "dots");
  (statuses || []).slice().reverse().forEach(s => strip.appendChild(el("span", "dot " + s)));
  return strip;
}

// --- capabilities -------------------------------------------------------- //
async function loadCapabilities() {
  const panel = document.getElementById("capPanel");
  const data = await api("/api/capabilities");
  panel.textContent = "";
  const detail = el("div", "cap-detail");   // shared expand area, appended last
  let activeChip = null;

  function group(label, tools, cls) {
    if (!tools.length) return;
    panel.appendChild(el("div", "cap-group-label", label));
    const chips = el("div", "chips");
    tools.forEach(t => {
      const chip = el("span", "chip " + cls, t.name);
      chip.addEventListener("click", () => {
        if (activeChip === chip) { chip.classList.remove("active"); detail.classList.remove("show"); activeChip = null; return; }
        if (activeChip) activeChip.classList.remove("active");
        chip.classList.add("active"); activeChip = chip;
        renderCapDetail(detail, t);
      });
      chips.appendChild(chip);
    });
    panel.appendChild(chips);
  }
  group("Read-only · Wren runs on its own", data.tools.filter(t => !t.mutates), "ro");
  group("Needs your confirmation", data.tools.filter(t => t.mutates), "wr");
  panel.appendChild(detail);
}

function renderCapDetail(detail, tool) {
  detail.textContent = "";
  detail.appendChild(el("h4", null, tool.name));
  if (tool.description) detail.appendChild(el("div", "desc", tool.description));
  if (tool.parameters.length) {
    tool.parameters.forEach(p => {
      const row = el("div", "param");
      const name = el("span", "pname", p.name);
      row.appendChild(name);
      row.appendChild(document.createTextNode(
        ` (${p.type}${p.required ? "" : ", optional"})` + (p.description ? " — " + p.description : "")));
      if (p.required) name.appendChild(el("span", "req", " *"));
      detail.appendChild(row);
    });
  } else {
    detail.appendChild(el("div", "param", "No parameters."));
  }
  detail.classList.add("show");
}

// --- push channel health -------------------------------------------------- //
// "ntfy up" means the ntfy server answered its health check — NOT that a push
// would deliver (a revoked token still reads healthy). The label names the
// server on purpose, since that's the exact scope of what the probe knows;
// don't reword it to imply delivery.
const PUSH_PILL = {
  ok:   { cls: "pill",     text: "ntfy up" },
  down: { cls: "pill down", text: "ntfy down" },
  off:  { cls: "pill off",  text: "ntfy off" },
};

function setPushPill(cls, text, title) {
  const pill = document.getElementById("pushPill");
  pill.className = cls;
  pill.title = title || "";
  pill.textContent = "";
  pill.appendChild(el("span", "glow"));
  pill.appendChild(document.createTextNode(text));
}

async function loadPushHealth() {
  // Every path that isn't a real verdict from the probe must say "unknown", not
  // guess. Defaulting a missing state to "off" reads as "you turned push off on
  // purpose" — a confident lie about the one thing this pill exists to answer.
  // fetch() does NOT reject on 401, so an expired session arrives here as a
  // JSON error body with no `state`, not as an exception.
  let health;
  try {
    health = await api("/api/health/ntfy");
  } catch (e) {
    setPushPill("pill off", "ntfy ?", "could not reach Wren to check");
    return;
  }
  const state = PUSH_PILL[health && health.state];
  if (!state) {
    setPushPill("pill off", "ntfy ?", health.error || "could not check the push channel");
    return;
  }
  setPushPill(state.cls, state.text, health.error);
}

// --- learnings wiki health ----------------------------------------------- //
function stat(figure, label, detail, warn) {
  const box = el("div", "stat");
  box.appendChild(el("div", "figure" + (warn ? " warn" : ""), figure));
  box.appendChild(el("div", "label", label));
  if (detail) box.appendChild(el("div", "detail", detail));
  return box;
}

async function loadVaultHealth() {
  const panel = document.getElementById("vaultPanel");
  const hint = document.getElementById("vaultHint");
  const v = await api("/api/vault_health");

  panel.textContent = "";
  if (!v.available) {
    panel.className = "panel muted";
    panel.textContent = v.error || "vault unavailable";
    hint.textContent = "";
    return;
  }
  panel.className = "panel";
  hint.textContent = v.vault;

  const stats = el("div", "stats");
  stats.appendChild(stat(String(v.wiki_pages), "pages"));

  // The oldest pending age is the signal, not the count: one file dropped this
  // morning is the normal state before the 9am ingest. Two days is not.
  const oldest = v.pending.length ? v.pending[0].days : 0;
  stats.appendChild(stat(
    String(v.pending_count),
    v.pending_count === 1 ? "file waiting" : "files waiting",
    v.pending.map(p => `${p.name} · ${p.days === 0 ? "today" : p.days + "d"}`).join("\n"),
    oldest >= 2));

  const commit = v.last_commit || "never";
  stats.appendChild(stat(
    commit,
    "last backup",
    v.unpushed === null ? "no remote configured"
      : v.unpushed === 0 ? "pushed"
      : `${v.unpushed} commit${v.unpushed === 1 ? "" : "s"} not pushed`,
    !!v.unpushed));

  panel.appendChild(stats);

  if (v.binaries) {
    // Not pending, ever: the ingest skips binaries by design, so without saying
    // so the pages/waiting numbers look like they don't add up.
    panel.appendChild(el("div", "detail",
      `${v.binaries} binary file${v.binaries === 1 ? "" : "s"} in raw/ — skipped by the ingest, never filed.`));
  }
}

// --- scheduled tasks, one box per agent --------------------------------- //
// Two agents live in this repo and a third is federated in, so a single table
// sorted by time said nothing about who owns what. Each owner gets a box
// holding its own duration charts and its own table, foldable down to a header.
const AGENTS = {
  wren:      { name: "Wren",      letter: "W", role: "reads the record, acts on request" },
  scribejay: { name: "ScribeJay", letter: "S", role: "writes the record — journaling only" },
  external:  { name: "Federated", letter: "F", role: "another repo's jobs, reported here only" },
  daemon:    { name: "Always-on", letter: "∞", role: "daemons and pollers — no schedule, no run history" },
};
const AGENT_ORDER = ["wren", "scribejay", "external", "daemon"];

// Which box a task belongs in. Daemons share one box whoever owns them: they
// have no schedule and no run history, so there is nothing per-agent to show.
function boxOf(task) { return task.is_daemon ? "daemon" : (AGENTS[task.agent] ? task.agent : "wren"); }

// Folded boxes, kept across re-renders. loadTasks() runs again every time a
// "Run now" finishes; without this, finishing a job would pop every box open.
const folded = new Set(["daemon"]);
// One redraw function per box on screen, so "collapse all" folds them in place
// rather than re-fetching the whole section to change a caret.
let boxes = [];

// The time of day a job fires, read off next_run rather than parsed out of the
// human_schedule prose — "2026-08-27T04:15" is structured, "Sundays 8:00 PM"
// is not.
function hourOf(task) {
  const m = /T(\d{2}):(\d{2})/.exec(task.next_run || "");
  return m ? (+m[1]) + (+m[2]) / 60 : null;
}
function clockOf(f) {
  const hh = Math.floor(f), mm = Math.round((f - hh) * 60);
  return `${hh % 12 === 0 ? 12 : hh % 12}:${String(mm).padStart(2, "0")} ${hh < 12 ? "AM" : "PM"}`;
}

async function loadTasks() {
  const wrap = document.getElementById("tasksWrap");
  // Both in one go: the charts are drawn inside the boxes, so a box cannot be
  // built until its series are in hand.
  const [data, stats] = await Promise.all([api("/api/schedules"), api("/api/run_stats")]);
  const tasks = data.tasks || [];
  const statTasks = (stats && !stats.error && stats.tasks) ? stats.tasks : [];
  const byKey = {};
  statTasks.forEach(t => { byKey[t.key] = t; });

  const scheduled = tasks.filter(t => !t.is_daemon).length;
  const daemons = tasks.length - scheduled;
  let hint = `${scheduled} scheduled${daemons ? ` · ${daemons} always-on` : ""}`;
  if (statTasks.length && window.WrenRunCharts) {
    hint += " · " + window.WrenRunCharts.caption(statTasks, stats.days, stats.limit);
  }
  document.getElementById("taskHint").textContent = hint;

  wrap.textContent = "";
  boxes = [];
  AGENT_ORDER.forEach(key => {
    const mine = tasks.filter(t => boxOf(t) === key);
    if (mine.length) wrap.appendChild(agentBox(key, mine, byKey, stats.days));
  });
  syncFoldAll();
}

function agentBox(key, tasks, statsByKey, days) {
  const meta = AGENTS[key];
  const stats = tasks.map(t => statsByKey[t.key]).filter(Boolean);
  const house = el("div", "house ag-" + key);

  const head = el("div", "house-head");
  const caret = el("div", "caret");
  head.appendChild(caret);
  head.appendChild(el("div", "mark", meta.letter));

  const who = el("div");
  who.appendChild(el("h3", null, meta.name));
  who.appendChild(el("div", "role", meta.role));
  // Folded, this is the only trace of the charts left — so it names the one
  // job worth unfolding the box for.
  const slowest = stats.filter(x => x.median_s != null)
                       .sort((a, b) => b.median_s - a.median_s)[0];
  if (slowest) {
    who.appendChild(el("div", "slow",
      `slowest: ${slowest.display_name} — median ${fmtDur(slowest.median_s)}, max ${fmtDur(slowest.max_s)}`));
  }
  head.appendChild(who);

  const facts = el("div", "facts");
  facts.appendChild(el("b", null, String(tasks.length)));
  if (key === "daemon") {
    facts.appendChild(el("div", null, "always running"));
  } else {
    const failing = tasks.filter(t => t.last_run && t.last_run.status === "failure").length;
    facts.appendChild(el("div", null, failing ? `${failing} failing` : "all green"));
    const times = tasks.map(hourOf).filter(v => v !== null).sort((a, b) => a - b);
    if (times.length) {
      facts.appendChild(el("div", null, `${clockOf(times[0])} – ${clockOf(times[times.length - 1])}`));
    }
  }
  head.appendChild(facts);
  house.appendChild(head);

  const body = el("div", "house-body");
  if (stats.length && window.WrenRunCharts) {
    const charts = el("div", "house-charts");
    window.WrenRunCharts.render(charts, stats, days);
    body.appendChild(charts);
  }
  const table = el("table");
  const thead = el("thead"), htr = el("tr");
  ["Task", "Schedule", "Next run", "Last status", ""].forEach(h => htr.appendChild(el("th", null, h)));
  thead.appendChild(htr);
  table.appendChild(thead);
  const tbody = el("tbody");
  tasks.forEach(t => tbody.appendChild(taskRow(t)));
  table.appendChild(tbody);
  body.appendChild(table);
  house.appendChild(body);

  function apply() {
    const open = !folded.has(key);
    body.hidden = !open;
    caret.textContent = open ? "▾" : "▸";
    head.setAttribute("aria-expanded", String(open));
  }
  head.addEventListener("click", () => {
    if (folded.has(key)) folded.delete(key); else folded.add(key);
    apply();
    syncFoldAll();
  });
  apply();
  boxes.push({ key, apply });
  return house;
}

const foldAllBtn = document.getElementById("foldAll");
function syncFoldAll() {
  foldAllBtn.textContent =
    (boxes.length && boxes.every(b => folded.has(b.key))) ? "expand all" : "collapse all";
}
foldAllBtn.addEventListener("click", () => {
  if (boxes.every(b => folded.has(b.key))) folded.clear();
  else boxes.forEach(b => folded.add(b.key));
  boxes.forEach(b => b.apply());
  syncFoldAll();
});

function taskRow(task) {
  const tr = el("tr", task.is_daemon ? "daemon" : "task-row");
  tr.appendChild(el("td", "name", task.display_name));
  tr.appendChild(el("td", "sched", task.human_schedule));
  tr.appendChild(el("td", "next", task.is_daemon ? "—" : fmtTs(task.next_run)));

  const statusTd = el("td");
  if (task.is_daemon) {
    statusTd.appendChild(badge("running"));
  } else {
    const st = task.last_run ? task.last_run.status : "none";
    statusTd.appendChild(badge(st));
    if (task.last_run) {
      statusTd.appendChild(el("div", "muted",
        `${fmtTs(task.last_run.start)} · ${fmtDur(task.last_run.duration_s)}`));
    }
    statusTd.appendChild(dotStrip(task.recent_statuses));
  }
  tr.appendChild(statusTd);

  const actionsTd = el("td");
  if (task.is_daemon) {
    actionsTd.appendChild(el("span", "muted", "—"));
  } else {
    const actions = el("div", "actions");
    // External tasks (another repo's launchd jobs) are report-only: the wiki
    // ingest can run for hours on the single Ollama slot, and starting it from
    // a phone would starve chat for the duration.
    if (!task.external) {
      const runBtn = el("button", "btn primary", "Run now");
      runBtn.title = "Runs the real task now, including its side effects (emails / calendar writes).";
      runBtn.addEventListener("click", (e) => { e.stopPropagation(); runNow(task, runBtn); });
      actions.appendChild(runBtn);
    }
    const runs = el("button", "btn", "See runs");
    runs.addEventListener("click", (e) => { e.stopPropagation(); openRuns(task.key); });
    actions.appendChild(runs);
    actionsTd.appendChild(actions);
    tr.addEventListener("click", () => openRuns(task.key));
  }
  tr.appendChild(actionsTd);
  return tr;
}

async function runNow(task, btn) {
  const ok = confirm(
    `Run "${task.display_name}" now?\n\n` +
    `This executes the real task immediately — the same thing the schedule does, ` +
    `including any side effects (sending email, writing calendar events).`);
  if (!ok) return;
  btn.disabled = true;
  btn.textContent = "Starting…";
  const res = await api("/api/run/" + encodeURIComponent(task.key), { method: "POST" });
  if (!res.ok) {
    btn.textContent = "Run now"; btn.disabled = false;
    alert("Could not start: " + (res.error || "unknown error"));
    return;
  }
  btn.textContent = "Running…";
  let failures = 0;
  const timer = setInterval(async () => {
    // A rejected fetch (server restart, dropped network, expired session)
    // must eventually stop the poll — otherwise a forgotten tab polls
    // forever. Tolerate a few blips, then give up and let a reload resume.
    try {
      const st = await api("/api/run/" + encodeURIComponent(task.key) + "/status");
      failures = 0;
      if (!st.running) { clearInterval(timer); loadTasks(); }
    } catch (e) {
      if (++failures >= 5) { clearInterval(timer); loadTasks(); }
    }
  }, 2500);
}

// --- run-detail slide-over ---------------------------------------------- //
const drawer = document.getElementById("drawer");
const backdrop = document.getElementById("backdrop");
function openDrawer() { drawer.classList.add("open"); backdrop.classList.add("show"); }
function closeDrawer() { drawer.classList.remove("open"); backdrop.classList.remove("show"); }
document.getElementById("drawerClose").addEventListener("click", closeDrawer);
backdrop.addEventListener("click", closeDrawer);

async function openRuns(key) {
  openDrawer();
  const body = document.getElementById("drawerBody");
  body.textContent = "Loading…";
  const data = await api("/api/runs/" + encodeURIComponent(key));
  document.getElementById("drawerTitle").textContent = data.task.display_name;
  body.textContent = "";
  body.appendChild(el("div", "muted", data.task.human_schedule));

  if (data.task.is_daemon) {
    body.appendChild(el("p", "muted", "The chat server runs continuously; it has no discrete scheduled runs."));
    return;
  }
  if (!data.runs.length) { body.appendChild(el("p", "muted", "No runs recorded yet.")); return; }

  const table = el("table");
  const htr = el("tr");
  ["When", "Duration", "Status", "Summary"].forEach(h => htr.appendChild(el("th", null, h)));
  table.appendChild(htr);
  data.runs.forEach(run => {
    const tr = el("tr", "task-row");
    tr.appendChild(el("td", null, fmtTs(run.start)));
    tr.appendChild(el("td", null, fmtDur(run.duration_s)));
    const st = el("td"); st.appendChild(badge(run.status)); tr.appendChild(st);
    tr.appendChild(el("td", null, run.summary || "—"));
    tr.addEventListener("click", () => openRun(key, run.id));
    table.appendChild(tr);
  });
  body.appendChild(table);
}

async function openRun(key, runId) {
  const body = document.getElementById("drawerBody");
  const run = await api(`/api/runs/${encodeURIComponent(key)}/${encodeURIComponent(runId)}`);
  body.textContent = "";
  const back = el("button", "link-btn", "← Back to run list");
  back.addEventListener("click", () => openRuns(key));
  body.appendChild(back);

  const h = el("div");
  h.style.display = "flex"; h.style.gap = "10px"; h.style.alignItems = "center"; h.style.margin = "4px 0 14px";
  h.appendChild(badge(run.status));
  h.appendChild(el("span", "muted", `${fmtTs(run.start)} · ${fmtDur(run.duration_s)}`));
  body.appendChild(h);

  if (!run.tool_calls.length) body.appendChild(el("p", "muted", "No tool calls recorded for this run."));
  const timeline = el("div", "timeline");
  run.tool_calls.forEach(c => {
    const box = el("div", "call");
    box.appendChild(el("div", "cname", c.name));
    if (c.args) box.appendChild(el("div", "cargs", c.args));
    if (c.result) box.appendChild(el("div", "cresult", c.result));
    timeline.appendChild(box);
  });
  body.appendChild(timeline);

  if (run.final_text) {
    const lbl = el("div", "muted"); lbl.style.margin = "16px 0 8px"; lbl.textContent = "Final response";
    body.appendChild(lbl);
    body.appendChild(el("div", "final", run.final_text));
  }
  if (run.error) {
    const lbl = el("div", "muted"); lbl.style.margin = "16px 0 8px"; lbl.textContent = "Error";
    body.appendChild(lbl);
    body.appendChild(el("div", "error-box", run.error));
  }
}

loadTasks();

loadPushHealth();
