<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wren Dashboard</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    color: #1f2328;
    background: #f4f4f5;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 16px;
    background: #ffffff;
    border-bottom: 1px solid #e5e7eb;
  }
  header h1 { font-size: 17px; margin: 0; margin-right: 8px; }
  nav { display: flex; gap: 4px; }
  nav button {
    background: none;
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 14px;
    color: #6b7280;
    cursor: pointer;
  }
  nav button.active { background: #1f2328; color: #ffffff; }

  main { flex: 1; overflow-y: auto; }
  .view { display: none; }
  .view.active { display: block; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 20px 16px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }

  .card {
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 16px;
  }
  .card h3 { margin: 0 0 2px; font-size: 15px; }
  .card .sched { color: #6b7280; font-size: 13px; margin-bottom: 12px; }
  .card .meta { font-size: 13px; color: #4b5563; margin: 3px 0; }
  .card.clickable { cursor: pointer; }
  .card.clickable:hover { border-color: #d0d5dd; }

  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; font-weight: 600;
    padding: 2px 8px; border-radius: 20px;
  }
  .badge.success { background: #ecfdf3; color: #067647; }
  .badge.failure { background: #fef3f2; color: #b42318; }
  .badge.running { background: #eff8ff; color: #175cd3; }
  .badge.none    { background: #f2f4f7; color: #667085; }

  .dots { display: flex; gap: 4px; margin: 12px 0 4px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #e5e7eb; }
  .dot.success { background: #17b26a; }
  .dot.failure { background: #f04438; }
  .dot.running { background: #2e90fa; }

  .row-actions { margin-top: 14px; display: flex; gap: 8px; align-items: center; }
  button.run {
    background: #1f2328; color: #fff; border: none; border-radius: 8px;
    padding: 8px 14px; font-size: 13px; cursor: pointer;
  }
  button.run:disabled { opacity: 0.5; cursor: default; }
  .daemon-note { color: #6b7280; font-size: 12px; }

  .back { background: none; border: none; color: #175cd3; cursor: pointer; font-size: 14px; padding: 0; margin-bottom: 14px; }

  table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; overflow: hidden; }
  th, td { text-align: left; padding: 10px 14px; font-size: 13px; border-bottom: 1px solid #f1f2f4; }
  th { background: #fafafa; color: #6b7280; font-weight: 600; }
  tr.run-row { cursor: pointer; }
  tr.run-row:hover td { background: #fafafa; }

  .timeline { display: flex; flex-direction: column; gap: 8px; }
  .call {
    background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 10px 12px;
  }
  .call .name { font-weight: 600; font-size: 13px; }
  .call .args, .call .result {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px; color: #475467; white-space: pre-wrap; word-break: break-word;
    margin-top: 4px;
  }
  .call .result { color: #1f2328; }
  .final { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 10px; padding: 12px; font-size: 14px; white-space: pre-wrap; }
  .error-box {
    background: #fef3f2; border: 1px solid #fecdca; border-radius: 10px; padding: 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
    color: #b42318; white-space: pre-wrap; word-break: break-word; margin-top: 10px;
  }
  .muted { color: #9ca3af; font-size: 13px; }
  .section-label { font-size: 13px; font-weight: 600; color: #6b7280; margin: 20px 0 10px; text-transform: uppercase; letter-spacing: 0.03em; }

  .param { font-size: 12px; color: #475467; margin: 3px 0; }
  .param .pname { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: #1f2328; }
  .req { color: #b42318; }

  /* Chat tab (ported from index.html) */
  #chatView { display: none; flex-direction: column; height: 100%; }
  #chatView.active { display: flex; }
  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; max-width: 920px; width: 100%; margin: 0 auto; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 14px; font-size: 15px; line-height: 1.4; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: #1f2328; color: white; }
  .msg.wren { align-self: flex-start; background: #ffffff; border: 1px solid #e5e7eb; }
  .msg.system { align-self: center; background: transparent; color: #9ca3af; font-size: 13px; }
  .msg.typing { display: flex; align-items: center; gap: 4px; padding: 14px; }
  .msg.typing .dot2 { width: 6px; height: 6px; border-radius: 50%; background: #9ca3af; animation: bounce 1.2s infinite ease-in-out; }
  .msg.typing .dot2:nth-child(2) { animation-delay: 0.15s; }
  .msg.typing .dot2:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%,60%,100% { opacity: 0.3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }
  .confirm { align-self: flex-start; max-width: 85%; background: #fff7ed; border: 1px solid #fed7aa; border-radius: 14px; padding: 12px 14px; font-size: 15px; }
  .confirm .actions { margin-top: 10px; display: flex; gap: 8px; }
  .confirm button { flex: 1; padding: 8px; border-radius: 8px; border: none; font-size: 14px; cursor: pointer; }
  .confirm .yes { background: #16a34a; color: white; }
  .confirm .no { background: #e5e7eb; color: #1f2328; }
  #composer { display: flex; gap: 8px; padding: 12px; background: #ffffff; border-top: 1px solid #e5e7eb; }
  #composerInner { display: flex; gap: 8px; max-width: 920px; width: 100%; margin: 0 auto; }
  #input { flex: 1; padding: 12px 14px; border-radius: 20px; border: 1px solid #d0d5dd; font-size: 16px; }
  #send { padding: 0 18px; border-radius: 20px; border: none; background: #1f2328; color: white; font-size: 15px; cursor: pointer; }
  #send:disabled { opacity: 0.5; }
</style>
</head>
<body>
  <header>
    <h1>Wren</h1>
    <nav>
      <button data-tab="overview" class="active">Overview</button>
      <button data-tab="capabilities">Capabilities</button>
      <button data-tab="chat">Chat</button>
    </nav>
  </header>

  <main>
    <section id="overviewView" class="view active"><div class="wrap">
      <div id="overviewGrid" class="grid"></div>
    </div></section>

    <section id="detailView" class="view"><div class="wrap">
      <button class="back" id="detailBack">&larr; Back to overview</button>
      <div id="detailHead"></div>
      <div id="detailBody"></div>
    </div></section>

    <section id="capabilitiesView" class="view"><div class="wrap">
      <div id="capBody"></div>
    </div></section>

    <section id="chatView" class="view">
      <div id="messages"></div>
      <form id="composer"><div id="composerInner">
        <input id="input" autocomplete="off" placeholder="Ask Wren anything..." >
        <button id="send" type="submit">Send</button>
      </div></form>
    </section>
  </main>

<script>
// --- helpers ------------------------------------------------------------- //
async function api(path, opts) {
  const resp = await fetch(path, opts);
  return resp.json();
}
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;  // textContent only — never innerHTML
  return e;
}
function fmtTs(ts) {
  if (!ts) return "—";
  // Accepts "2026-07-06 06:12:13,214" or ISO "2026-07-07T06:00".
  const clean = ts.replace(",", ".").replace(" ", "T");
  const d = new Date(clean);
  if (isNaN(d)) return ts;
  return d.toLocaleString([], { weekday: "short", month: "short", day: "numeric",
                                hour: "numeric", minute: "2-digit" });
}
function fmtDur(s) {
  if (s == null) return "—";
  if (s < 60) return s + "s";
  const m = Math.floor(s / 60), r = Math.round(s % 60);
  return `${m}m ${r}s`;
}
function badge(status) {
  const labels = { success: "✓ Success", failure: "✗ Failed", running: "• Running", none: "No runs yet" };
  return el("span", "badge " + status, labels[status] || status);
}

// --- tabs ---------------------------------------------------------------- //
const views = { overview: "overviewView", capabilities: "capabilitiesView", chat: "chatView", detail: "detailView" };
function showTab(tab) {
  Object.values(views).forEach(id => document.getElementById(id).classList.remove("active"));
  document.getElementById(views[tab]).classList.add("active");
  document.querySelectorAll("nav button").forEach(b =>
    b.classList.toggle("active", b.dataset.tab === tab));
}
document.querySelectorAll("nav button").forEach(b =>
  b.addEventListener("click", () => {
    showTab(b.dataset.tab);
    if (b.dataset.tab === "overview") loadOverview();
    if (b.dataset.tab === "capabilities") loadCapabilities();
  }));

// --- overview ------------------------------------------------------------ //
async function loadOverview() {
  const grid = document.getElementById("overviewGrid");
  grid.textContent = "";
  const data = await api("/api/schedules");
  (data.tasks || []).forEach(task => grid.appendChild(taskCard(task)));
}

function taskCard(task) {
  const card = el("div", "card");
  const head = el("div");
  head.style.display = "flex";
  head.style.justifyContent = "space-between";
  head.style.alignItems = "center";
  head.appendChild(el("h3", null, task.display_name));
  const status = task.is_daemon ? "running" : (task.last_run ? task.last_run.status : "none");
  head.appendChild(badge(task.is_daemon ? "running" : status));
  card.appendChild(head);

  card.appendChild(el("div", "sched", task.human_schedule));

  if (task.is_daemon) {
    card.appendChild(el("div", "meta", "Always-on chat server (this dashboard)."));
    return card;
  }

  card.appendChild(el("div", "meta", "Next run: " + fmtTs(task.next_run)));
  if (task.last_run) {
    card.appendChild(el("div", "meta",
      `Last run: ${fmtTs(task.last_run.start)} · ${fmtDur(task.last_run.duration_s)}`));
    if (task.last_run.summary)
      card.appendChild(el("div", "meta", task.last_run.summary));
  } else {
    card.appendChild(el("div", "meta", "No runs recorded yet."));
  }

  const dots = el("div", "dots");
  (task.recent_statuses || []).slice().reverse().forEach(s => dots.appendChild(el("span", "dot " + s)));
  card.appendChild(dots);

  const actions = el("div", "row-actions");
  const runBtn = el("button", "run", "Run now");
  runBtn.title = "Runs the real task now, including its side effects (emails / calendar writes).";
  runBtn.addEventListener("click", (e) => { e.stopPropagation(); runNow(task, runBtn); });
  const view = el("button", "run", "View runs");
  view.style.background = "#f2f4f7";
  view.style.color = "#1f2328";
  view.addEventListener("click", (e) => { e.stopPropagation(); openDetail(task.key); });
  actions.appendChild(runBtn);
  actions.appendChild(view);
  card.appendChild(actions);

  card.classList.add("clickable");
  card.addEventListener("click", () => openDetail(task.key));
  return card;
}

async function runNow(task, btn) {
  const ok = confirm(
    `Run "${task.display_name}" now?\n\n` +
    `This executes the real task immediately — the same thing the schedule does, ` +
    `including any side effects (sending email, writing calendar events).`);
  if (!ok) return;
  btn.disabled = true;
  btn.textContent = "Starting…";
  const res = await api("/api/run/" + encodeURIComponent(task.key), { method: "POST" });
  if (!res.ok) {
    btn.textContent = "Run now";
    btn.disabled = false;
    alert("Could not start: " + (res.error || "unknown error"));
    return;
  }
  btn.textContent = "Running…";
  pollRun(task, btn);
}

function pollRun(task, btn) {
  const timer = setInterval(async () => {
    const st = await api("/api/run/" + encodeURIComponent(task.key) + "/status");
    if (!st.running) {
      clearInterval(timer);
      btn.textContent = "Run now";
      btn.disabled = false;
      loadOverview();  // refresh cards so the new run shows up
    }
  }, 2500);
}

// --- task detail --------------------------------------------------------- //
document.getElementById("detailBack").addEventListener("click", () => {
  showTab("overview"); loadOverview();
});

async function openDetail(key) {
  showTab("detail");
  const head = document.getElementById("detailHead");
  const body = document.getElementById("detailBody");
  head.textContent = ""; body.textContent = "Loading…";
  const data = await api("/api/runs/" + encodeURIComponent(key));

  head.appendChild(el("h1", null, data.task.display_name));
  head.appendChild(el("div", "sched", data.task.human_schedule));
  body.textContent = "";

  if (data.task.is_daemon) {
    body.appendChild(el("p", "muted", "The chat server runs continuously; it has no discrete scheduled runs."));
    return;
  }
  if (!data.runs.length) {
    body.appendChild(el("p", "muted", "No runs recorded yet."));
    return;
  }

  const table = el("table");
  const thead = el("tr");
  ["When", "Duration", "Status", "Summary"].forEach(h => thead.appendChild(el("th", null, h)));
  table.appendChild(thead);
  data.runs.forEach(run => {
    const tr = el("tr", "run-row");
    tr.appendChild(el("td", null, fmtTs(run.start)));
    tr.appendChild(el("td", null, fmtDur(run.duration_s)));
    const st = el("td"); st.appendChild(badge(run.status)); tr.appendChild(st);
    tr.appendChild(el("td", null, run.summary || "—"));
    tr.addEventListener("click", () => openRun(key, run.id));
    table.appendChild(tr);
  });
  body.appendChild(table);
}

async function openRun(key, runId) {
  const body = document.getElementById("detailBody");
  const run = await api(`/api/runs/${encodeURIComponent(key)}/${encodeURIComponent(runId)}`);
  body.textContent = "";
  const back = el("button", "back", "&larr; Back to run list");
  back.textContent = "← Back to run list";
  back.addEventListener("click", () => openDetail(key));
  body.appendChild(back);

  const h = el("div");
  h.style.display = "flex"; h.style.gap = "10px"; h.style.alignItems = "center"; h.style.margin = "6px 0 14px";
  h.appendChild(badge(run.status));
  h.appendChild(el("span", "muted", `${fmtTs(run.start)} · ${fmtDur(run.duration_s)}`));
  body.appendChild(h);

  if (!run.tool_calls.length) body.appendChild(el("p", "muted", "No tool calls recorded for this run."));

  const timeline = el("div", "timeline");
  run.tool_calls.forEach(c => {
    const box = el("div", "call");
    box.appendChild(el("div", "name", c.name));
    if (c.args) box.appendChild(el("div", "args", c.args));
    if (c.result) box.appendChild(el("div", "result", c.result));
    timeline.appendChild(box);
  });
  body.appendChild(timeline);

  if (run.final_text) {
    body.appendChild(el("div", "section-label", "Final response"));
    body.appendChild(el("div", "final", run.final_text));
  }
  if (run.error) {
    body.appendChild(el("div", "section-label", "Error"));
    body.appendChild(el("div", "error-box", run.error));
  }
}

// --- capabilities -------------------------------------------------------- //
async function loadCapabilities() {
  const body = document.getElementById("capBody");
  body.textContent = "Loading…";
  const data = await api("/api/capabilities");
  body.textContent = "";
  const readOnly = data.tools.filter(t => !t.mutates);
  const mutating = data.tools.filter(t => t.mutates);
  renderCapGroup(body, "Read-only — Wren runs these on its own", readOnly);
  renderCapGroup(body, "Requires your confirmation", mutating);
}

function renderCapGroup(parent, label, tools) {
  if (!tools.length) return;
  parent.appendChild(el("div", "section-label", label));
  const grid = el("div", "grid");
  tools.forEach(t => {
    const card = el("div", "card");
    card.appendChild(el("h3", null, t.name));
    card.appendChild(el("div", "meta", t.description));
    if (t.parameters.length) {
      const pl = el("div");
      pl.style.marginTop = "8px";
      t.parameters.forEach(p => {
        const row = el("div", "param");
        const name = el("span", "pname", p.name);
        row.appendChild(name);
        row.appendChild(document.createTextNode(
          ` (${p.type}${p.required ? "" : ", optional"})` + (p.description ? " — " + p.description : "")));
        if (p.required) name.appendChild(el("span", "req", " *"));
        pl.appendChild(row);
      });
      card.appendChild(pl);
    }
    grid.appendChild(card);
  });
  parent.appendChild(grid);
}

// --- chat (ported from index.html, same endpoints) ----------------------- //
const messagesEl = document.getElementById("messages");
const form = document.getElementById("composer");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const GREETING = "Hi Craig, what can I do for you today?";
let chatStarted = false;

function addMessage(role, text) {
  const div = el("div", "msg " + role, text);
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}
function addTyping() {
  const div = el("div", "msg wren typing");
  div.appendChild(el("span", "dot2"));
  div.appendChild(el("span", "dot2"));
  div.appendChild(el("span", "dot2"));
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}
function addConfirm(summary, onDecide) {
  const div = el("div", "confirm");
  div.appendChild(el("div", null, summary));  // model-derived text -> textContent
  const actions = el("div", "actions");
  const yes = el("button", "yes", "Confirm");
  const no = el("button", "no", "Cancel");
  actions.appendChild(yes); actions.appendChild(no);
  div.appendChild(actions);
  yes.onclick = () => { onDecide(true); div.remove(); };
  no.onclick = () => { onDecide(false); div.remove(); };
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
function setBusy(b) { input.disabled = b; sendBtn.disabled = b; }

function handleResult(result, typingEl) {
  if (typingEl) typingEl.remove();
  if (result.error) { addMessage("system", "Error: " + result.error); setBusy(false); return; }
  if (result.type === "final") { addMessage("wren", result.text); setBusy(false); }
  else if (result.type === "confirm") {
    addConfirm(result.summary, async (approved) => {
      setBusy(true);
      const t = addTyping();
      const resp = await fetch("/chat/confirm", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ approved }) });
      handleResult(await resp.json(), t);
    });
    setBusy(false);
  }
}
form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const message = input.value.trim();
  if (!message) return;
  addMessage("user", message);
  input.value = "";
  setBusy(true);
  const t = addTyping();
  const resp = await fetch("/chat", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message }) });
  handleResult(await resp.json(), t);
});
// Lazily greet the first time the Chat tab is opened.
document.querySelector('nav button[data-tab="chat"]').addEventListener("click", () => {
  if (!chatStarted) { chatStarted = true; addMessage("wren", GREETING); }
  input.focus();
});

// --- boot ---------------------------------------------------------------- //
loadOverview();
</script>
</body>
</html>
