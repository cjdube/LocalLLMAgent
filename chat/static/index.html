<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wren</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="alternate icon" type="image/png" href="/static/favicon-32.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="stylesheet" href="/static/nav.css">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    color: #1f2328;
    background: #f4f4f5;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    background: #ffffff;
    border-bottom: 1px solid #e5e7eb;
  }
  header img.logo { height: 38px; width: 38px; border-radius: 9px; display: block; }
  header h1 { font-size: 17px; margin: 0; }
  header .sub { font-size: 13px; color: #9ca3af; }
  header .spacer { flex: 1; }
  header button {
    background: none;
    border: 1px solid #d0d5dd;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
    color: #6b7280;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 15px;
    line-height: 1.4;
    white-space: pre-wrap;
  }
  .msg.user { align-self: flex-end; background: #1f2328; color: white; }
  .msg.wren { align-self: flex-start; background: #ffffff; border: 1px solid #e5e7eb; }
  .msg.wren a { overflow-wrap: anywhere; }
  .msg.system { align-self: center; background: transparent; color: #9ca3af; font-size: 13px; }
  .msg.wren.escalated { border-color: #ddd0f5; }
  .msg.wren.escalated .badge { display: block; font-size: 11px; font-weight: 600; color: #7c3aed; margin-bottom: 4px; }
  .escalate { align-self: flex-start; margin: -6px 0 2px; padding: 5px 11px; font-size: 13px; background: #ffffff; color: #4b5563; border: 1px solid #d0d5dd; border-radius: 8px; cursor: pointer; }
  .escalate:hover { background: #f3f0fb; color: #7c3aed; border-color: #ddd0f5; }
  .escalate:disabled { opacity: 0.5; cursor: default; }
  /* The busy offer: two .escalate buttons side by side rather than stacked,
     centred under the .msg.system notice they belong to (which is centred too —
     left-aligning them read as a stray pair of buttons). Wraps rather than
     overflowing, since the frontier model's name goes in a button label. */
  .offer { align-self: center; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: -2px 0 2px; }
  .offer .escalate { margin: 0; }
  .msg.typing { display: flex; align-items: center; gap: 4px; padding: 14px; }
  .msg.typing .typing-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #9ca3af;
    animation: typing-bounce 1.2s infinite ease-in-out;
  }
  .msg.typing .typing-dot:nth-child(2) { animation-delay: 0.15s; }
  .msg.typing .typing-dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes typing-bounce {
    0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
    30% { opacity: 1; transform: translateY(-3px); }
  }
  .confirm {
    align-self: flex-start;
    max-width: 85%;
    background: #fff7ed;
    border: 1px solid #fed7aa;
    border-radius: 14px;
    padding: 12px 14px;
    font-size: 15px;
  }
  .confirm .detail {
    margin-top: 8px;
    padding: 8px 10px;
    background: #ffffff;
    border: 1px solid #fed7aa;
    border-radius: 8px;
    font-size: 13px;
    color: #6b7280;
    white-space: pre-wrap;
    max-height: 160px;
    overflow-y: auto;
  }
  .confirm .actions { margin-top: 10px; display: flex; gap: 8px; }
  .confirm button {
    flex: 1;
    padding: 8px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
  }
  .confirm .yes { background: #16a34a; color: white; }
  .confirm .no { background: #e5e7eb; color: #1f2328; }
  form#composer {
    /* The height of #input holding a single line: line-height, plus its
       padding, plus its border. The row is bottom-aligned rather than
       stretched — a stretched Send button would grow into a tall bar as the
       message does — so the button needs this height to keep matching the
       one-line box instead of collapsing to the height of its label. */
    --composer-row: calc(16px * 1.4 + 24px + 2px);
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 12px;
    background: #ffffff;
    border-top: 1px solid #e5e7eb;
  }
  /* A textarea, not an input, so a long message wraps into view instead of
     scrolling sideways. chat-dock.js sets the height from the content on
     every keystroke; max-height is what stops it from eating the page. */
  #input {
    flex: 1;
    padding: 12px 14px;
    border-radius: 20px;
    border: 1px solid #d0d5dd;
    font-size: 16px;
    font-family: inherit;
    line-height: 1.4;
    resize: none;
    overflow-y: auto;
    min-height: var(--composer-row);
    max-height: 40vh;
  }
  #send {
    height: var(--composer-row);
    padding: 0 18px;
    border-radius: 20px;
    border: none;
    background: #1f2328;
    color: white;
    font-size: 15px;
  }
  #send:disabled { opacity: 0.5; }
  #send.stop { background: #b42318; }
</style>
</head>
<body>
  <header>
    <img class="logo" src="/static/favicon.svg" alt="Wren">
    <h1>Wren</h1>
    <span class="sub">chat</span>
    <span class="spacer"></span>
    <nav id="wren-nav" class="wren-nav"></nav>
    <button id="newChat">New chat</button>
  </header>
  <div id="messages"></div>
  <form id="composer">
    <textarea id="input" rows="1" autocomplete="off" placeholder="Ask Wren anything..." autofocus></textarea>
    <button id="send" type="submit">Send</button>
  </form>

<script src="/static/chat-dock.js"></script>
<script src="/static/nav.js"></script>
</body>
</html>
