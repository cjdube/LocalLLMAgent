<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wren</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="alternate icon" type="image/png" href="/static/favicon-32.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    color: #1f2328;
    background: #f4f4f5;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px;
    background: #ffffff;
    border-bottom: 1px solid #e5e7eb;
  }
  header h1 { font-size: 17px; margin: 0; }
  header button {
    background: none;
    border: 1px solid #d0d5dd;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
    color: #6b7280;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 15px;
    line-height: 1.4;
    white-space: pre-wrap;
  }
  .msg.user { align-self: flex-end; background: #1f2328; color: white; }
  .msg.wren { align-self: flex-start; background: #ffffff; border: 1px solid #e5e7eb; }
  .msg.system { align-self: center; background: transparent; color: #9ca3af; font-size: 13px; }
  .msg.typing { display: flex; align-items: center; gap: 4px; padding: 14px; }
  .msg.typing .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #9ca3af;
    animation: typing-bounce 1.2s infinite ease-in-out;
  }
  .msg.typing .dot:nth-child(2) { animation-delay: 0.15s; }
  .msg.typing .dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes typing-bounce {
    0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
    30% { opacity: 1; transform: translateY(-3px); }
  }
  .confirm {
    align-self: flex-start;
    max-width: 85%;
    background: #fff7ed;
    border: 1px solid #fed7aa;
    border-radius: 14px;
    padding: 12px 14px;
    font-size: 15px;
  }
  .confirm .detail {
    margin-top: 8px;
    padding: 8px 10px;
    background: #ffffff;
    border: 1px solid #fed7aa;
    border-radius: 8px;
    font-size: 13px;
    color: #6b7280;
    white-space: pre-wrap;
    max-height: 160px;
    overflow-y: auto;
  }
  .confirm .actions { margin-top: 10px; display: flex; gap: 8px; }
  .confirm button {
    flex: 1;
    padding: 8px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
  }
  .confirm .yes { background: #16a34a; color: white; }
  .confirm .no { background: #e5e7eb; color: #1f2328; }
  form#composer {
    display: flex;
    gap: 8px;
    padding: 12px;
    background: #ffffff;
    border-top: 1px solid #e5e7eb;
  }
  #input {
    flex: 1;
    padding: 12px 14px;
    border-radius: 20px;
    border: 1px solid #d0d5dd;
    font-size: 16px;
  }
  #send {
    padding: 0 18px;
    border-radius: 20px;
    border: none;
    background: #1f2328;
    color: white;
    font-size: 15px;
  }
  #send:disabled { opacity: 0.5; }
  #send.stop { background: #b42318; }
</style>
</head>
<body>
  <header>
    <h1>Wren</h1>
    <button id="newChat">New chat</button>
  </header>
  <div id="messages"></div>
  <form id="composer">
    <input id="input" autocomplete="off" placeholder="Ask Wren anything..." autofocus>
    <button id="send" type="submit">Send</button>
  </form>

<script>
const messagesEl = document.getElementById("messages");
const form = document.getElementById("composer");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const newChatBtn = document.getElementById("newChat");
const GREETING = "Hi Craig, what can I do for you today?";

function addMessage(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function addTyping() {
  const div = document.createElement("div");
  div.className = "msg wren typing";
  div.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function addConfirm(summary, detail, onDecide) {
  const div = document.createElement("div");
  div.className = "confirm";

  // summary is model-derived (email subjects, event titles Wren reads from
  // your data), so assign it as text — never innerHTML — to avoid an
  // HTML/script injection sink.
  const summaryEl = document.createElement("div");
  summaryEl.textContent = summary;

  // detail (e.g. the email body) lets you see what's actually being sent
  // before approving. Same rule: textContent only, never innerHTML.
  let detailEl = null;
  if (detail) {
    detailEl = document.createElement("div");
    detailEl.className = "detail";
    detailEl.textContent = detail;
  }

  const actions = document.createElement("div");
  actions.className = "actions";
  const yes = document.createElement("button");
  yes.className = "yes";
  yes.textContent = "Confirm";
  const no = document.createElement("button");
  no.className = "no";
  no.textContent = "Cancel";
  actions.appendChild(yes);
  actions.appendChild(no);

  div.appendChild(summaryEl);
  if (detailEl) div.appendChild(detailEl);
  div.appendChild(actions);

  yes.onclick = () => { onDecide(true); div.remove(); };
  no.onclick = () => { onDecide(false); div.remove(); };
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

// While a turn is running the Send button becomes a Stop button (it stays
// enabled so it can cancel); the input is disabled until the turn ends.
let busy = false;
function setBusy(b) {
  busy = b;
  input.disabled = b;
  sendBtn.textContent = b ? "Stop" : "Send";
  sendBtn.classList.toggle("stop", b);
}

function handleResult(result, typingEl) {
  if (typingEl) typingEl.remove();
  if (result.error) {
    addMessage("system", "Error: " + result.error);
    setBusy(false);
    return;
  }
  if (result.type === "final") {
    addMessage("wren", result.text);
    setBusy(false);
  } else if (result.type === "cancelled") {
    addMessage("system", "Stopped.");
    setBusy(false);
  } else if (result.type === "confirm") {
    addConfirm(result.summary, result.detail, async (approved) => {
      setBusy(true);
      const confirmTyping = addTyping();
      const resp = await fetch("/chat/confirm", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ approved }),
      });
      handleResult(await resp.json(), confirmTyping);
    });
    setBusy(false);
  }
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  if (busy) {  // the button is showing "Stop" — cancel the running turn
    await fetch("/chat/cancel", { method: "POST" });
    return;
  }
  const message = input.value.trim();
  if (!message) return;
  addMessage("user", message);
  input.value = "";
  setBusy(true);
  const typingEl = addTyping();
  const resp = await fetch("/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message }),
  });
  handleResult(await resp.json(), typingEl);
});

newChatBtn.addEventListener("click", async () => {
  await fetch("/chat/new", { method: "POST" });
  messagesEl.innerHTML = "";
  addMessage("wren", GREETING);
});

addMessage("wren", GREETING);
</script>
</body>
</html>
