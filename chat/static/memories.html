<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wren Memories</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="alternate icon" type="image/png" href="/static/favicon-32.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    color: #1f2328;
    background: #f4f4f5;
  }
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    background: #ffffff;
    border-bottom: 1px solid #e5e7eb;
  }
  header img.logo { height: 38px; width: 38px; border-radius: 9px; display: block; }
  header h1 { font-size: 17px; margin: 0; }
  header .sub { font-size: 13px; color: #9ca3af; }
  header .spacer { flex: 1; }
  header a.nav { font-size: 13px; color: #6b7280; text-decoration: none; }
  header a.nav:hover { color: #1f2328; }

  main { max-width: 900px; margin: 0 auto; padding: 20px 18px 40px; display: flex; flex-direction: column; gap: 22px; }
  .section-label { font-size: 13px; font-weight: 600; color: #6b7280; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: baseline; }
  .section-label .hint { font-weight: 400; font-size: 12px; color: #9ca3af; }

  .panel { background: #ffffff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 14px 16px; }
  .empty { color: #9ca3af; font-size: 13px; }

  table { width: 100%; table-layout: fixed; border-collapse: collapse; background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; overflow: hidden; }
  col.category { width: 130px; }
  col.created { width: 130px; }
  col.count { width: 90px; }
  thead th { text-align: left; background: #fafafa; color: #6b7280; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; padding: 10px 14px; border-bottom: 1px solid #eef0f2; }
  tbody td { padding: 13px 14px; font-size: 13px; line-height: 1.5; border-top: 1px solid #f1f2f4; vertical-align: top; }
  tbody tr:hover td { background: #fafafa; }
  td.memory { word-break: break-word; }
  th.count, td.count { font-variant-numeric: tabular-nums; text-align: right; }
  td.created { color: #6b7280; white-space: nowrap; }

  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px; white-space: nowrap; background: #f2f4f7; color: #667085; }
</style>
</head>
<body>
  <header>
    <img class="logo" src="/static/favicon.svg" alt="Wren">
    <h1>Wren</h1>
    <span class="sub">memories</span>
    <span class="spacer"></span>
    <a class="nav" href="/starred">starred</a>
    <a class="nav" href="/map">map</a>
  </header>

  <main>
    <section>
      <div class="section-label">Active <span id="activeHint" class="hint"></span></div>
      <div id="activeWrap" class="panel">Loading…</div>
    </section>
    <section>
      <div class="section-label">Archival <span id="archivalHint" class="hint"></span></div>
      <div id="archivalWrap" class="panel">Loading…</div>
    </section>
  </main>

<script>
async function api(path) { return (await fetch(path)).json(); }
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;  // textContent only — never innerHTML
  return e;
}
function fmtTs(ts) {
  if (!ts) return "—";
  const d = new Date(ts);
  if (isNaN(d)) return ts;
  return d.toLocaleString([], { year: "numeric", month: "short", day: "numeric" });
}

function categoryTd(m) {
  const td = el("td");
  if (m.category) td.appendChild(el("span", "badge", m.category));
  return td;
}

function renderActive(memories, wrap) {
  wrap.textContent = "";
  if (!memories.length) { wrap.appendChild(el("div", "empty", "No pinned memories yet.")); return; }
  const table = el("table");
  const colgroup = el("colgroup");
  colgroup.appendChild(el("col", "category"));
  colgroup.appendChild(el("col"));
  colgroup.appendChild(el("col", "created"));
  table.appendChild(colgroup);
  const thead = el("thead");
  const htr = el("tr");
  ["Category", "Memory", "Created"].forEach(h => htr.appendChild(el("th", null, h)));
  thead.appendChild(htr);
  table.appendChild(thead);
  const tbody = el("tbody");
  memories.forEach(m => {
    const tr = el("tr");
    tr.appendChild(categoryTd(m));
    tr.appendChild(el("td", "memory", m.text));
    tr.appendChild(el("td", "created", fmtTs(m.created)));
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);
}

function renderArchival(memories, wrap) {
  wrap.textContent = "";
  if (!memories.length) { wrap.appendChild(el("div", "empty", "No archival memories yet.")); return; }
  const table = el("table");
  const colgroup = el("colgroup");
  colgroup.appendChild(el("col", "category"));
  colgroup.appendChild(el("col"));
  colgroup.appendChild(el("col", "created"));
  colgroup.appendChild(el("col", "count"));
  table.appendChild(colgroup);
  const thead = el("thead");
  const htr = el("tr");
  ["Category", "Memory", "Created", "Accessed"].forEach(h => {
    const th = el("th", h === "Accessed" ? "count" : null, h);
    htr.appendChild(th);
  });
  thead.appendChild(htr);
  table.appendChild(thead);
  const tbody = el("tbody");
  memories.forEach(m => {
    const tr = el("tr");
    tr.appendChild(categoryTd(m));
    tr.appendChild(el("td", "memory", m.text));
    tr.appendChild(el("td", "created", fmtTs(m.created)));
    tr.appendChild(el("td", "count", String(m.access_count || 0)));
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);
}

async function load() {
  const data = await api("/api/memories");
  const active = data.active || [];
  const archival = data.archival || [];
  document.getElementById("activeHint").textContent = `${active.length}`;
  document.getElementById("archivalHint").textContent = `${archival.length}`;
  renderActive(active, document.getElementById("activeWrap"));
  renderArchival(archival, document.getElementById("archivalWrap"));
}

load();
</script>
</body>
</html>
