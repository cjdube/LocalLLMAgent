<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wren Activity</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="alternate icon" type="image/png" href="/static/favicon-32.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="stylesheet" href="/static/nav.css">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    color: #1f2328;
    background: #f4f4f5;
  }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; background: #ffffff; border-bottom: 1px solid #e5e7eb;
  }
  header img.logo { height: 38px; width: 38px; border-radius: 9px; display: block; }
  header h1 { font-size: 17px; margin: 0; }
  header .sub { font-size: 13px; color: #9ca3af; }
  header .spacer { flex: 1; }

  main { max-width: 1100px; margin: 0 auto; padding: 18px 18px 40px; }

  .card {
    background: #fff; border: 1px solid #e5e7eb; border-radius: 12px;
    padding: 14px 16px; margin-bottom: 14px;
  }
  .card h2 { font-size: 14px; margin: 0 0 10px; font-weight: 600; }

  .range { display: flex; gap: 6px; align-items: center; }
  .range button {
    font: inherit; font-size: 13px; padding: 5px 11px; cursor: pointer;
    border: 1px solid #d5d8dd; border-radius: 8px; background: #fff; color: #6b7280;
  }
  .range button.active { background: #1f2328; border-color: #1f2328; color: #fff; }

  .page-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .page-head h2 { font-size: 20px; margin: 0; font-weight: 600; }
  .page-head .spacer { flex: 1; }

  /* Four across on a desktop, two on a phone. auto-fit rather than a fixed
     count so the cards reflow instead of squeezing — this page gets opened on
     the phone as often as the laptop. */
  .metrics {
    display: grid; gap: 12px; margin-bottom: 14px;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  }
  .metric {
    background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 13px 15px;
  }
  .metric p { margin: 0; }
  .metric-label { font-size: 12px; color: #6b7280; }
  .metric-value { font-size: 25px; font-weight: 600; margin-top: 3px !important; letter-spacing: -0.3px; }
  .metric-note { font-size: 12px; color: #9ca3af; margin-top: 3px !important; }

  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: #6b7280; margin-bottom: 12px; }
  .legend-item { display: inline-flex; align-items: center; gap: 6px; }
  .legend-swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

  /* Fluid width, fixed height: the SVG uses preserveAspectRatio="none", so the
     bars stretch horizontally on a wide screen without the labels growing. */
  .usage-svg { width: 100%; height: 200px; display: block; }
  .usage-grid { stroke: #eceef1; stroke-width: 1; }
  .usage-axis { font-size: 9px; fill: #9ca3af; text-anchor: end; }
  .usage-bar { shape-rendering: crispEdges; }

  .split { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }

  .bar-row { margin-bottom: 10px; }
  .bar-head { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
  .bar-value { color: #6b7280; }
  .bar-track { height: 7px; background: #f1f2f4; border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; background: #3a76c4; border-radius: 4px; }

  .task-row {
    display: flex; justify-content: space-between; gap: 10px;
    font-size: 13px; padding: 6px 0; border-bottom: 1px solid #f1f2f4;
  }
  .task-row:last-child { border-bottom: none; }
  .task-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .task-detail { color: #6b7280; white-space: nowrap; }

  .empty { font-size: 13px; color: #9ca3af; margin: 4px 0; }
  .note { font-size: 12px; color: #9ca3af; line-height: 1.5; margin: 0; }
</style>
</head>
<body>
  <header>
    <img class="logo" src="/static/favicon.svg" alt="Wren">
    <h1>Wren</h1>
    <span class="sub">activity</span>
    <span class="spacer"></span>
    <nav id="wren-nav" class="wren-nav"></nav>
  </header>

  <main>
    <div class="page-head">
      <h2>Activity</h2>
      <span class="spacer"></span>
      <div class="range" id="usageRange">
        <button type="button" data-days="7" class="active">7d</button>
        <button type="button" data-days="30">30d</button>
        <button type="button" data-days="90">90d</button>
      </div>
    </div>

    <div class="metrics" id="usageCards"></div>

    <div class="card">
      <h2>Tokens per day</h2>
      <div class="legend" id="usageLegend"></div>
      <div id="usageChart"></div>
    </div>

    <div class="split">
      <div class="card">
        <h2>By agent</h2>
        <div id="usageAgents"></div>
      </div>
      <div class="card">
        <h2>Busiest jobs</h2>
        <div id="usageTasks"></div>
      </div>
    </div>

    <p class="note" id="usageNote"></p>
  </main>

  <script src="/static/nav.js"></script>
  <script src="/static/usage-chart.js"></script>
</body>
</html>
